  <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>معجم التاسع  
    </title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>
    <style>

    /* --- التصميم الكلاسيكي الفخم (بني وذهبي) --- */
    :root {
        --dark-brown: #3e2723;   /* بني محروق للغلاف */
        --gold: #d4af37;         /* ذهبي ملكي للعناوين */
        --paper: #f5f5dc;        /* لون الورق القديم */
        --border-brown: #5d4037; /* بني متوسط للحدود */
    }

    body { 
        background-color: #d7ccc8; 
        font-family: 'Amiri', serif; 
        margin: 0; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
    }

    #book-wrapper { margin-top: 50px; margin-bottom: 100px; position: relative; }
    #book { width: 950px; height: 620px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); } 

    /* تنسيق الصفحات الداخلية (ورق قديم) */
    .page { 
        background-color: var(--paper); 
        border: 2px solid var(--border-brown); 
        padding: 25px; 
        box-sizing: border-box; 
        background-image: radial-gradient(#efebe9 1px, transparent 0); 
        background-size: 20px 20px;
        overflow-y: auto;
    }

    /* الغلاف: بني ملكي بخطوط ذهبية */
    .cover { 
        background: var(--dark-brown) !important; 
        color: var(--gold) !important; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        justify-content: center; 
        border: 10px double var(--gold) !important;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        font-size: 45px;
        text-align: center;
    }

    /* عناوين الدروس */
    .page h1 { 
        font-size: 28px; 
        color: var(--dark-brown); 
        border-bottom: 3px double var(--gold); 
        padding-bottom: 5px; 
        margin-bottom: 15px; 
        text-align: center;
    }

    /* صناديق الكلمات */
    .word-box { 
        background: rgba(93, 64, 55, 0.05); 
        border-right: 5px solid var(--gold); 
        margin-bottom: 10px; 
        padding: 10px 15px;
        border-radius: 0 10px 10px 0;
        transition: 0.3s;
    }

    .word-box:hover { background: rgba(212, 175, 55, 0.1); }

    .word-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #d7ccc8; }
    .word-header b { font-size: 24px; color: var(--dark-brown); }
    
    .root-badge { color: #795548; font-style: italic; font-size: 17px; font-weight: bold; }

    .meaning-text { font-size: 19px; color: #4e342e; margin: 5px 0; line-height: 1.6; }
    .example-text { font-size: 17px; color: #795548; font-family: 'Lateef', serif; }

    /* أزرار التحكم السفلي */
    .controls { 
        position: fixed; 
        bottom: 0; 
        width: 100%; 
        background: var(--dark-brown); 
        padding: 15px; 
        display: flex; 
        justify-content: center; 
        gap: 20px; 
        z-index: 1000; 
        border-top: 2px solid var(--gold);
    }

    .btn { 
        background: var(--gold); 
        color: var(--dark-brown); 
        border: 1px solid #fff; 
        padding: 8px 30px; 
        cursor: pointer; 
        font-size: 20px; 
        font-weight: bold; 
        border-radius: 5px;
        font-family: 'Amiri', serif;
    }

    /* الفهرس */
    #index-overlay { 
        position: fixed; 
        top: 0; 
        left: 0; 
        width: 100%; 
        height: 100%; 
        background: rgba(0,0,0,0.9); 
        display: none; 
        align-items: center; 
        justify-content: center; 
        z-index: 9999; 
    }

    .index-content { 
        background: var(--paper); 
        padding: 30px; 
        border-radius: 10px; 
        border: 5px solid var(--gold); 
        width: 70%; 
        max-height: 80%; 
        overflow-y: auto; 
        text-align: center; 
    }

    #units-grid { 
        display: grid; 
        grid-template-columns: 1fr 1fr; 
        gap: 12px; 
        margin-top: 15px; 
    }

    #units-grid button { 
        background: var(--border-brown); 
        color: var(--gold); 
        padding: 12px; 
        border: none; 
        font-size: 18px; 
        cursor: pointer; 
        border-radius: 5px; 
        font-family: 'Amiri', serif;
    }

    #units-grid button:hover { background: var(--dark-brown); transform: scale(1.02); }

    </style>
</head>

        $(document).ready(function() {
            const book = $("#book");
            let currentPage = 2;

            Object.keys(dictionaryData).forEach((lesson) => {
                const words = dictionaryData[lesson];
                let content = "";
                words.forEach(item => {
                    content += `<div class="word-box">
                        <div class="word-header"><b>${item.word}</b><span class="root-badge">${item.root}</span></div>
                        <p class="meaning-text">${item.meaning}</p>
                        <p class="example-text">${item.example}</p>
                    </div>`;
                });

                // إضافة الصفحة للكتاب
                book.append(`<div class="page"><h1>${lesson}</h1>${content}</div>`);
                
                // إضافة زر للفهرس
                $("#units-grid").append(`<button onclick="jump(${currentPage})">${lesson}</button>`);
                currentPage++;
            });

            // تشغيل مكتبة turn.js
            book.turn({
                width: 950,
                height: 620,
                autoCenter: true,
                display: 'double',
                acceleration: true,
                gradients: true
            });
        });

        function jump(p) {
            $("#book").turn("page", p);
            $("#index-overlay").fadeOut();
        }
