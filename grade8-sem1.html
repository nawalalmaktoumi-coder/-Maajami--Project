        $(document).ready(function() {
            const book = $("#book");
            
            // إنشاء الصفحات ديناميكياً بناءً على البيانات
            Object.keys(dictionaryData).forEach((lesson, i) => {
                let p1 = "", p2 = "";
                
                // تقسيم الكلمات الـ 20 على صفحتين
                dictionaryData[lesson].slice(0, 10).forEach(item => p1 += createBox(item));
                dictionaryData[lesson].slice(10, 20).forEach(item => p2 += createBox(item));
                
                book.append(`<div class="page"><h1>${lesson} (1)</h1>${p1}</div>`);
                book.append(`<div class="page"><h1>${lesson} (2)</h1>${p2}</div>`);
                
                // إضافة زر في الفهرس
                let pageNum = (i * 2) + 2;
                $("#units-grid").append(`<button onclick="jump(${pageNum})">${lesson}</button>`);
            });

            // تفعيل مكتبة Turn.js
            book.turn({
                width: 950,
                height: 620,
                autoCenter: true,
                display: 'double',
                gradients: true,
                acceleration: true
            });
        });

        // دالة إنشاء صندوق الكلمة
        function createBox(item) {
            return `
            <div class="word-box">
                <div class="word-header">
                    <b>${item.word}</b>
                    <span class="root-badge">جذر: ${item.root}</span>
                </div>
                <p class="meaning-text">المعنى: ${item.meaning}</p>
                <p class="example-text">مثال: ${item.example}</p>
            </div>`;
        }

        // دالة القفز لصفحة معينة
        function jump(p) {
            $("#book").turn("page", p);
            $("#index-overlay").fadeOut();
        }
    </script>
