  <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المعجم الإلكتروني | الرئيسية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-brown: #2c1810; 
            --card-bg: #fffbf2;
            --accent-gold: #c69b5d;
            --btn-gradient: linear-gradient(to left, #3e2723, #5d4037);
            --text-main: #ffffff;
            --text-dark: #3e2723;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--dark-brown);
            background-image: radial-gradient(circle at top, #3e2723 0%, #1b0c07 100%);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
            padding-top: 40px;
        }

        .header { text-align: center; margin-bottom: 20px; }
        .stars { color: var(--accent-gold); font-size: 20px; margin-bottom: 5px; }
        h1 { font-size: 2.5rem; margin: 0; text-shadow: 2px 2px 5px rgba(0,0,0,0.5); }
        .subtitle { color: #d7ccc8; font-size: 0.95rem; margin-top: 10px; max-width: 550px; line-height: 1.6; }

        .nav-bar { display: flex; gap: 20px; margin: 20px 0; }
        .nav-item { color: #a1887f; text-decoration: none; font-weight: bold; padding: 5px 15px; border-radius: 20px; transition: 0.3s; }
        .nav-item.active { border: 1.5px solid var(--accent-gold); color: var(--accent-gold); }

        .main-card {
            background-color: var(--card-bg);
            width: 85%;
            max-width: 650px;
            border-radius: 25px;
            padding: 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
            color: var(--text-dark);
            margin-bottom: 50px;
            border: 1px solid #efebe9;
        }

        .card-title {
            text-align: right;
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 20px;
            border-bottom: 2px solid #d7ccc8;
            padding-bottom: 10px;
        }

        /* تنسيق الأزرار بناءً على كودك */
        .grade-btn {
            background: var(--btn-gradient);
            color: white;
            border: none;
            width: 100%;
            padding: 16px 20px;
            margin-bottom: 12px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: 0.3s;
        }

        .grade-btn:hover { transform: translateY(-2px); filter: brightness(1.2); }

        /* حاوية الفصول الدراسية */
        .semester-container {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: -5px 0 15px 0;
            padding: 15px;
            background: #efebe9;
            border-radius: 0 0 15px 15px;
            border: 1px solid #d7ccc8;
        }

        .sem-btn {
            background: white;
            color: var(--dark-brown);
            text-decoration: none;
            padding: 10px;
            text-align: center;
            border-radius: 8px;
            font-weight: bold;
            border: 1px solid #bcaaa4;
            transition: 0.2s;
        }

        .sem-btn:hover { background: var(--dark-brown); color: white; }

        footer {
            margin-top: auto;
            background: rgba(0,0,0,0.5);
            width: 100%;
            padding: 25px 0;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .footer-content { font-size: 0.85rem; color: #8d6e63; }
    </style>
</head>
<body>

    <div class="header">
        <div class="stars">✦ ✶ ✦</div>
        <h1>المعجم الإلكتروني</h1>
        <p class="subtitle">اكتشف جمال اللغة العربية من خلال معجم تفاعلي ودروس قراءة لطلاب الصفوف ٧–١٠</p>
    </div>

    <div class="nav-bar">
        <div class="nav-bar">
        <a href="team.html" class="nav-item">الفريق</a>
        
        <a href="dictionary.html" class="nav-item">المعجم</a>
        
        <a href="index.html" class="nav-item active">الرئيسية</a>
    </div>
    </div>

    <div class="main-card">
        <div class="card-title">اختر صفَّك الدراسي 📖</div>

        <div class="button-group">
            <div class="grade-section">
                <button class="grade-btn" onclick="toggle('g7')">الصف السابع <span>⌵</span></button>
                <div id="g7" class="semester-container">
                    <a href="grade7-sem1.html" class="sem-btn">الفصل الأول</a>
                    <a href="grade7-sem2.html" class="sem-btn">الفصل الثاني</a>
                </div>
            </div>

            <div class="grade-section">
                <button class="grade-btn" onclick="toggle('g8')">الصف الثامن <span>⌵</span></button>
                <div id="g8" class="semester-container">
                    <a href="grade8-sem1.html" class="sem-btn">الفصل الأول</a>
                    <a href="grade8sem2.html" class="sem-btn">الفصل الثاني</a>
                </div>
            </div>

            <div class="grade-section">
                <button class="grade-btn" onclick="toggle('g9')">الصف التاسع <span>⌵</span></button>
                <div id="g9" class="semester-container">
                    <a href="grade9-sem1.html" class="sem-btn">الفصل الأول</a>
                    <a href="grade9-sem2.html" class="sem-btn">الفصل الثاني</a>
                </div>
            </div>

            <div class="grade-section">
                <button class="grade-btn" onclick="toggle('g10')">الصف العاشر <span>⌵</span></button>
                <div id="g10" class="semester-container">
                    <a href="grade10-sem1.html" class="sem-btn">الفصل الأول</a>
                    <a href="grade10-sem2.html" class="sem-btn">الفصل الثاني</a>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-content">
            <p>جميع الحقوق محفوظة لمشروع المعجم الإلكتروني © ٢٠٢٦</p>
        </div>
    </footer>

    <script>
        function toggle(id) {
            const target = document.getElementById(id);
            const isOpen = target.style.display === 'grid';
            
            // إغلاق أي قائمة مفتوحة أخرى
            document.querySelectorAll('.semester-container').forEach(b => b.style.display = 'none');
            
            // فتح القائمة المطلوبة
            target.style.display = isOpen ? 'none' : 'grid';
        }
    </script>

</body>
</html>
