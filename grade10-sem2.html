 <!DOCTYPE html>

        { word: "الوفاء", root: "وفي", meaning: "الإخلاص للمكان وعدم التخلي عنه", example: "وفاء الأبناء لقريتهم جعلها تخلع ثوب الحداد." }
    ]

        };

        $(document).ready(function() {
            const book = $("#book");
            let currentPage = 2;

            Object.keys(dictionaryData).forEach((lesson) => {
                const words = dictionaryData[lesson];
                let content = "";
                words.forEach(item => {
                    content += `<div class="word-box">
                        <div class="word-header"><b>${item.word}</b><span class="root-badge">${item.root}</span></div>
                        <p class="meaning-text">${item.meaning}</p>
                        <p class="example-text">${item.example}</p>
                    </div>`;
                });

                // إضافة الصفحة للكتاب
                book.append(`<div class="page"><h1>${lesson}</h1>${content}</div>`);
                
                // إضافة زر للفهرس
                $("#units-grid").append(`<button onclick="jump(${currentPage})">${lesson}</button>`);
                currentPage++;
            });

            // تشغيل مكتبة turn.js
            book.turn({
                width: 950,
                height: 620,
                autoCenter: true,
                display: 'double',
                acceleration: true,
                gradients: true
            });
        });

        function jump(p) {
            $("#book").turn("page", p);
            $("#index-overlay").fadeOut();
        }
    </script>
</body>
</html>
