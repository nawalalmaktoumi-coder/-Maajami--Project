        $(document).ready(function() {
            const book = $("#book");
            Object.keys(dictionaryData).forEach((lesson, i) => {
                let p = "";
                dictionaryData[lesson].forEach(item => p += createBox(item));
                book.append(`<div class="page"><h1>${lesson}</h1>${p}</div>`);
                let pageNum = i + 2;
                $("#units-grid").append(`<button onclick="jump(${pageNum})">${lesson}</button>`);
            });
            book.turn({ width: 950, height: 620, autoCenter: true, display: 'double' });
        });

        function createBox(item) {
            return `<div class="word-box"><div class="word-header"><b>${item.word}</b><span class="root-badge">جذر: ${item.root}</span></div><p class="meaning-text">المعنى: ${item.meaning}</p><p class="example-text">مثال: ${item.example}</p></div>`;
        }
        function jump(p) { $("#book").turn("page", p); $("#index-overlay").fadeOut(); }
    </script>
