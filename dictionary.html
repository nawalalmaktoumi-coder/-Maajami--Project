 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المعجم الإلكتروني | البحث</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-brown: #2c1810; 
            --card-bg: #fffbf2;
            --accent-gold: #c69b5d;
            --text-dark: #3e2723;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--dark-brown);
            background-image: radial-gradient(circle at top, #3e2723 0%, #1b0c07 100%);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: white;
            padding-top: 40px;
        }

        .nav-bar { display: flex; gap: 20px; margin-bottom: 30px; }
        .nav-item { color: #a1887f; text-decoration: none; font-weight: bold; padding: 5px 15px; border-radius: 20px; }
        .nav-item.active { border: 1.5px solid var(--accent-gold); color: var(--accent-gold); }

        .search-card {
            background-color: var(--card-bg);
            width: 85%;
            max-width: 600px;
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
            color: var(--text-dark);
            text-align: center;
        }

        input {
            width: 90%;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #d7ccc8;
            font-family: 'Tajawal';
            font-size: 1.1rem;
            margin-bottom: 20px;
            outline: none;
        }

        #result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 15px;
            background: #efebe9;
            min-height: 50px;
            display: none; /* يظهر فقط عند البحث */
        }

        .word-title { color: #5d4037; font-weight: bold; font-size: 1.4rem; }
        .word-mean { color: #2c1810; margin-top: 10px; font-size: 1.2rem; }
    </style>
</head>
<body>

    <div class="nav-bar">
    <a href="team.html" class="nav-item">الفريق</a>
    <a href="dictionary.html" class="nav-item active">المعجم</a>
    <a href="index.html" class="nav-item">الرئيسية</a>
</div>

    <div class="search-card">
        <h2>البحث في المعجم 🔍</h2>
        <input type="text" id="searchInput" placeholder="اكتب الكلمة هنا..." onkeyup="searchWord()">
        
        <div id="result">
            <div class="word-title" id="resTitle"></div>
            <div class="word-mean" id="resMean"></div>
        </div>
    </div>

    <script>
        // هنا تقدرين تزيدين الكلمات والدروس اللي تبغينها
        const dictionary = {
            "البشرف": "قطعة موسيقية آلية تتألف من أربع خانات وتسليم.",
            "الدولاب": "مقطوعة موسيقية قصيرة تمهد للمقام.",
            "مقام الكرد": "أحد المقامات الموسيقية الشرقية التي تبدأ من درجة الري.",
            "المقصورة": "قصيدة تنتهي بألف مقصورة مثل قصيدة ابن دريد."
        };

        function searchWord() {
            const input = document.getElementById('searchInput').value.trim();
            const resultDiv = document.getElementById('result');
            const resTitle = document.getElementById('resTitle');
            const resMean = document.getElementById('resMean');

            if (dictionary[input]) {
                resultDiv.style.display = 'block';
                resTitle.innerText = input;
                resMean.innerText = dictionary[input];
            } else {
                resultDiv.style.display = 'none';
            }
        }
    </script>
</body>
</html>
